  <style>
/* 星めぐりペンギン — 画面UIのスタイル(ゲーム盤面はCanvasで描画) */

:root {
  --ink: #12254d;
  --ink-soft: #3a5283;
  --paper: #f6fbff;
  --glass: rgba(255, 255, 255, 0.82);
  --glass-strong: rgba(255, 255, 255, 0.94);
  --star: #ffe27a;
  --star-deep: #d99a14;
  --accent: #5aa7ff;
  --danger: #ff7a7a;
  --radius: 16px;
  --shadow: 0 6px 18px rgba(10, 25, 70, 0.28);
  --font: "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #16275e;
  color: var(--ink);
  font-family: var(--font);
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

#game {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#ui { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; }
.screen { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; }
.screen[hidden] { display: none; }
.screen > * { pointer-events: auto; }

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: 0;
}
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------------------------------------------------------------- HUD */
.hud-top {
  position: absolute;
  top: calc(var(--safe-top) + 8px);
  left: 10px;
  right: 10px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}
.hud-top > * { pointer-events: auto; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 44px;
  padding: 0 14px;
  border-radius: 22px;
  background: var(--glass);
  box-shadow: var(--shadow);
  font-weight: 700;
  font-size: 15px;
}
.chip:hover { background: var(--glass-strong); }
.chip-icon { font-size: 18px; line-height: 1; }

.hud-title {
  flex: 1;
  text-align: center;
  color: #fff;
  text-shadow: 0 2px 6px rgba(8, 20, 60, 0.6);
  line-height: 1.15;
  pointer-events: none;
}
.hud-stage { font-size: 24px; font-weight: 800; letter-spacing: 0.04em; }
.hud-world { font-size: 12px; opacity: 0.9; }

/* 手数 / 目標 を「0 / 10」の数字だけで表示する */
.hud-count {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 104px;
  height: 44px;
  padding: 0 16px;
  border-radius: 22px;
  background: var(--glass);
  box-shadow: var(--shadow);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.hud-count b { font-size: 30px; font-weight: 800; }
.hud-count .slash { font-size: 22px; font-weight: 600; color: var(--ink-soft); opacity: 0.55; }
.hud-count .par { font-size: 22px; font-weight: 700; color: var(--ink-soft); }
/* 目標を超えたら(=★3を逃したら)オレンジ系にする。もどして目標以内に戻ると元の色に戻る */
.hud-count.over { background: #fff0d2; }
.hud-count.over b { color: #b45309; }
.hud-count.pop b { animation: pop 0.25s ease-out; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@keyframes pop { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }

.hud-bottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(var(--safe-bottom) + 12px);
  display: flex;
  justify-content: center;
  gap: 10px;
  pointer-events: none;
}
.hud-bottom > * { pointer-events: auto; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 104px;
  height: 52px;
  padding: 0 16px;
  border-radius: var(--radius);
  background: var(--glass);
  box-shadow: var(--shadow);
  font-weight: 800;
  font-size: 15px;
  transition: transform 0.08s, background 0.15s;
}
.btn:hover { background: var(--glass-strong); }
.btn:active { transform: scale(0.95); }
.btn-icon { font-size: 18px; line-height: 1; }
.btn.attention { animation: attention 0.9s ease-in-out infinite; background: #fff3c4; }
@keyframes attention { 50% { transform: scale(1.08); } }

.toast {
  position: absolute;
  left: 50%;
  top: calc(var(--safe-top) + 70px);
  transform: translateX(-50%);
  max-width: min(92vw, 520px);
  padding: 10px 18px;
  border-radius: 14px;
  background: rgba(18, 37, 77, 0.88);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  box-shadow: var(--shadow);
  pointer-events: none !important;
  animation: toast-in 0.2s ease-out;
}
.toast.warn { background: rgba(160, 50, 60, 0.92); }
.toast.hint { background: rgba(160, 110, 10, 0.92); }
.toast.tip { background: rgba(30, 80, 170, 0.92); line-height: 1.5; }
.toast[hidden], .stuck[hidden], .dpad[hidden] { display: none; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, -8px); } }

.stuck {
  position: absolute;
  left: 50%;
  bottom: calc(var(--safe-bottom) + 76px);
  transform: translateX(-50%);
  max-width: min(92vw, 520px);
  padding: 8px 16px;
  border-radius: 12px;
  background: rgba(160, 50, 60, 0.92);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  pointer-events: none !important;
}

/* 画面の十字ボタン(設定でオン) */
.dpad {
  position: absolute;
  right: 12px;
  bottom: calc(var(--safe-bottom) + 76px);
  width: 156px;
  height: 156px;
  display: grid;
  grid-template: "a b c" "d e f" "g h i" / 1fr 1fr 1fr;
  gap: 4px;
}
.dpad button {
  border-radius: 14px;
  background: var(--glass);
  box-shadow: var(--shadow);
  font-size: 22px;
  font-weight: 800;
}
.dpad button:active { background: #fff3c4; }
.dpad button[data-dir="0"] { grid-area: b; }
.dpad button[data-dir="3"] { grid-area: d; }
.dpad button[data-dir="1"] { grid-area: f; }
.dpad button[data-dir="2"] { grid-area: h; }

@media (max-width: 520px) {
  .chip-text { display: none; }
  .chip { padding: 0 12px; }
  .btn { min-width: 0; flex: 1; max-width: 120px; padding: 0 10px; font-size: 14px; }
  .hud-bottom { padding: 0 10px; }
  .hud-stage { font-size: 20px; }
}

/* 画面の高さが低いとき(横向きのスマホなど): HUDを小さくして盤面を広く使う */
@media (max-height: 520px) {
  .hud-top { top: calc(var(--safe-top) + 4px); height: 42px; }
  .chip { height: 38px; padding: 0 12px; }
  .hud-stage { font-size: 18px; }
  .hud-world { display: none; }
  .hud-count { min-width: 84px; height: 36px; padding: 0 12px; gap: 5px; }
  .hud-count b { font-size: 22px; }
  .hud-count .slash, .hud-count .par { font-size: 16px; }
  .hud-bottom { bottom: calc(var(--safe-bottom) + 6px); gap: 8px; }
  .btn { height: 40px; min-width: 0; padding: 0 12px; font-size: 13px; }
  .toast { top: calc(var(--safe-top) + 52px); font-size: 13px; padding: 6px 12px; }
  .stuck { bottom: calc(var(--safe-bottom) + 54px); font-size: 12px; }
  .dpad { width: 120px; height: 120px; bottom: calc(var(--safe-bottom) + 54px); }
  .dpad button { font-size: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .btn.attention, .hud-count.pop b, .toast { animation: none; }
}
</style>
  <style>
/* 星めぐりペンギン — 各画面(タイトル・ステージ選択・ポーズ・クリア・設定・エンディング)のスタイル */

/* ================================================================ 共通パーツ */
.big {
  display: block;
  width: 100%;
  min-height: 54px;
  padding: 12px 20px;
  border-radius: var(--radius);
  background: linear-gradient(#ffffff, #dcecfb);
  box-shadow: 0 4px 0 #9fbbdc, var(--shadow);
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 0.04em;
  transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
}
.big:hover { filter: brightness(1.05); }
.big:active { transform: translateY(3px); box-shadow: 0 1px 0 #9fbbdc, var(--shadow); }
.big.primary { background: linear-gradient(#fff3b8, #ffd34a); box-shadow: 0 4px 0 #c98b0a, var(--shadow); }
.big.primary:active { box-shadow: 0 1px 0 #c98b0a, var(--shadow); }
.big.danger { background: linear-gradient(#ffe4e4, #ffb9b9); box-shadow: 0 4px 0 #c97a7a, var(--shadow); font-size: 15px; }
.big[hidden] { display: none; }
.big:disabled { opacity: 0.5; cursor: default; }

.overlay {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(8, 16, 48, 0.55);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  pointer-events: auto;
  animation: fade-in 0.2s ease-out;
}
.overlay[hidden] { display: none; }
@keyframes fade-in { from { opacity: 0; } }

.panel {
  width: min(92vw, 420px);
  max-height: 92vh;
  overflow-y: auto;
  padding: 22px 22px 20px;
  border-radius: 24px;
  background: var(--paper);
  box-shadow: 0 12px 40px rgba(5, 12, 40, 0.5);
  text-align: center;
  animation: panel-in 0.28s cubic-bezier(0.2, 1.2, 0.4, 1);
}
.panel h2 { margin: 0 0 14px; font-size: 24px; }
@keyframes panel-in { from { opacity: 0; transform: translateY(14px) scale(0.96); } }
.panel-buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.panel-buttons.row { flex-direction: row; flex-wrap: wrap; justify-content: center; }
.panel-buttons.row .big { width: auto; min-width: 150px; flex: 1; }

/* ================================================================ スプラッシュ・タイトル */
.splash { display: grid; place-items: center; pointer-events: auto; }
.splash[hidden] { display: none; }
.splash-btn { width: 100%; height: 100%; background: transparent; color: #fff; display: grid; place-content: center; gap: 22px; text-align: center; }
.splash-title {
  font-size: clamp(34px, 9vw, 72px);
  font-weight: 800;
  letter-spacing: 0.06em;
  text-shadow: 0 0 24px rgba(255, 226, 122, 0.7), 0 4px 10px rgba(5, 12, 40, 0.6);
}
.splash-hint { font-size: clamp(14px, 3.4vw, 20px); opacity: 0.9; animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.3; } }

.title-wrap {
  position: absolute;
  left: 50%;
  top: 6vh;
  transform: translateX(-50%);
  width: min(94vw, 600px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.title-wrap > * { pointer-events: auto; }
.logo { margin: 0; text-align: center; color: #fff; line-height: 1.05; }
.logo-sub { display: block; font-size: clamp(13px, 3.2vw, 18px); letter-spacing: 0.5em; margin-bottom: 4px; text-shadow: 0 2px 6px rgba(5, 12, 40, 0.7); }
.logo-main {
  display: block;
  white-space: nowrap;
  font-size: clamp(26px, 8vw, 56px);
  font-weight: 800;
  letter-spacing: 0.04em;
  text-shadow: 0 0 22px rgba(255, 226, 122, 0.65), 0 4px 0 #1b2f7a, 0 8px 18px rgba(5, 12, 40, 0.6);
}
.logo-star { color: var(--star); margin-right: 0.15em; display: inline-block; animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(1.18) rotate(12deg); filter: brightness(1.3); } }
.tagline { margin: 0 0 8px; color: #fff; font-size: clamp(13px, 3.4vw, 17px); text-shadow: 0 2px 6px rgba(5, 12, 40, 0.7); }
.menu { width: min(78vw, 300px); display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.menu .big { font-size: 20px; }

/* ================================================================ ステージ選択 */
#screen-select { display: flex; flex-direction: column; align-items: center; padding: calc(var(--safe-top) + 8px) 10px calc(var(--safe-bottom) + 10px); gap: 10px; overflow-y: auto; pointer-events: auto; }
#screen-select[hidden] { display: none; }
#screen-select > * { width: min(100%, 640px); flex: 0 0 auto; }
.sel-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 52px; }
.sel-title { margin: 0; flex: 1; text-align: center; color: #fff; font-size: 22px; text-shadow: 0 2px 8px rgba(5, 12, 40, 0.7); }
.sel-total { min-width: 96px; padding: 8px 12px; border-radius: 16px; background: var(--glass); box-shadow: var(--shadow); text-align: center; font-weight: 700; white-space: nowrap; }
.sel-total b { font-size: 18px; color: var(--star-deep); }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
.tab {
  flex: 1 0 auto;
  min-width: 84px;
  padding: 8px 10px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.55);
  color: var(--ink);
  font-weight: 800;
  font-size: 13px;
  line-height: 1.25;
  text-align: center;
  box-shadow: 0 3px 0 rgba(20, 40, 90, 0.25);
}
.tab small { display: block; font-weight: 600; font-size: 11px; opacity: 0.8; }
.tab[aria-selected="true"] { background: #fff3b8; box-shadow: 0 3px 0 #c98b0a; }
.tab:disabled { opacity: 0.45; cursor: default; }

.world-panel { padding: 16px 14px 18px; border-radius: 22px; background: var(--glass-strong); box-shadow: var(--shadow); }
.world-name { margin: 0 0 4px; font-size: 22px; text-align: center; }
.world-intro { margin: 0 0 4px; font-size: 14px; line-height: 1.6; text-align: center; color: #28406f; }
.world-new { margin: 0 0 14px; font-size: 12px; text-align: center; color: var(--star-deep); font-weight: 800; }
.stage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.stage-btn {
  position: relative;
  aspect-ratio: 1 / 1.05;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border-radius: 14px;
  background: linear-gradient(#ffffff, #d7e8f9);
  box-shadow: 0 4px 0 #9fbbdc;
  font-weight: 800;
  transition: transform 0.08s;
}
.stage-btn:hover:not(:disabled) { transform: translateY(-2px); }
.stage-btn:active:not(:disabled) { transform: translateY(2px); }
.stage-btn .num { font-size: clamp(15px, 4vw, 20px); }
.stage-btn .stars { font-size: clamp(10px, 2.8vw, 14px); letter-spacing: 1px; color: #c8d3e3; }
.stage-btn .stars .on { color: var(--star); text-shadow: 0 1px 0 #c98b0a; }
.stage-btn .best { font-size: clamp(9px, 2.4vw, 11px); color: #3a5283; font-weight: 600; }
.stage-btn[data-state="cleared"] { background: linear-gradient(#fffbe5, #ffeaa0); box-shadow: 0 4px 0 #d9aa2e; }
.stage-btn[data-state="next"] { animation: next-pulse 1.4s ease-in-out infinite; background: linear-gradient(#e8fff5, #aef0cf); box-shadow: 0 4px 0 #4fb98a; }
.stage-btn[data-state="next"]::after { content: "NEW"; position: absolute; top: -7px; right: -4px; padding: 1px 6px; border-radius: 8px; background: #ff6f91; color: #fff; font-size: 10px; }
.stage-btn[data-state="locked"] { background: #c6d2e4; box-shadow: 0 4px 0 #8c9db8; color: #6f819f; cursor: default; }
.stage-btn[data-state="locked"] .num { font-size: 13px; }
@keyframes next-pulse { 50% { transform: scale(1.06); } }

/* ================================================================ クリア画面 */
.clear-panel h2 { margin: 4px 0 0; font-size: 28px; color: #c97a00; }
.badge { display: inline-block; margin: 0 0 6px; padding: 3px 14px; border-radius: 14px; background: linear-gradient(#ff9bd0, #ff6f91); color: #fff; font-weight: 800; font-size: 14px; animation: pop-badge 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
.badge[hidden] { display: none; }
@keyframes pop-badge { from { transform: scale(0); } }
.clear-stage { margin: 2px 0 6px; font-size: 16px; color: #3a5283; font-weight: 700; }
.clear-stars { display: flex; justify-content: center; gap: 8px; margin: 4px 0 8px; }
.clear-stars i { font-style: normal; font-size: 54px; line-height: 1; color: #d3deec; transform: scale(0.6); opacity: 0.7; transition: transform 0.35s cubic-bezier(0.2, 1.8, 0.4, 1), color 0.2s, opacity 0.2s; }
.clear-stars i.on { color: var(--star); transform: scale(1); opacity: 1; text-shadow: 0 3px 0 #c98b0a, 0 0 22px rgba(255, 226, 122, 0.9); }
.clear-moves { margin: 0; font-size: 18px; }
.clear-moves b { font-size: 34px; }
.clear-moves .par { font-size: 14px; color: #3a5283; }
.clear-note { min-height: 1.4em; margin: 6px 0 0; font-size: 14px; font-weight: 700; color: #1d8a5a; }

/* ================================================================ 設定 */
.settings-panel { text-align: left; }
.settings-panel h2 { text-align: center; }
.row-set { display: flex; align-items: center; gap: 12px; padding: 9px 2px; border-bottom: 1px solid #dbe6f3; font-weight: 700; font-size: 15px; }
.row-set > span { flex: 0 0 5.5em; }
.row-set.check > span { flex: 1; }
.row-set input[type="range"] { flex: 1; accent-color: #ffb400; min-width: 0; height: 28px; }
.row-set output { width: 2.8em; text-align: right; font-variant-numeric: tabular-nums; color: #3a5283; }
.row-set input[type="checkbox"] { width: 26px; height: 26px; accent-color: #ffb400; }
.set-msg { min-height: 1.4em; margin: 8px 0 0; font-size: 13px; text-align: center; color: #c0392b; font-weight: 700; }

/* ================================================================ エンディング */
.ending { pointer-events: none; }
.ending[hidden] { display: none; }
.ending-text {
  position: absolute;
  left: 50%;
  bottom: 2vh;
  transform: translateX(-50%);
  width: min(92vw, 520px);
  max-height: 34vh;
  overflow-y: auto;
  padding: 14px 16px 16px;
  border-radius: 20px;
  background: rgba(6, 12, 44, 0.62);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  color: #fff;
  text-align: center;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.2s ease;
}
.ending-text.show { opacity: 1; pointer-events: auto; }
.ending-text .big { color: var(--ink); text-shadow: none; }
.ending-text p { margin: 4px 0; font-size: clamp(14px, 3.6vw, 18px); line-height: 1.7; opacity: 0; transform: translateY(8px); }
.ending-text .e-stats { font-size: clamp(15px, 3.8vw, 19px); color: var(--star); font-weight: 800; }
.ending-text .e-stats b { font-size: 1.3em; }
.ending-text.show p { animation: e-in 0.9s ease forwards; }
.ending-text.show p:nth-child(1) { animation-delay: 0.3s; }
.ending-text.show p:nth-child(2) { animation-delay: 1.4s; }
.ending-text.show p:nth-child(3) { animation-delay: 2.6s; }
.ending-text.show p:nth-child(4) { animation-delay: 3.8s; }
.ending-text .panel-buttons { opacity: 0; }
.ending-text.show .panel-buttons { animation: e-in 0.9s ease 4.8s forwards; }
@keyframes e-in { to { opacity: 1; transform: none; } }

/* 横長の画面: 星座は左、文章は右 */
@media (min-aspect-ratio: 23/20) {
  .ending-text { left: auto; right: 3vw; bottom: 50%; transform: translateY(50%); width: min(46vw, 520px); max-height: 92vh; }
}

@media (max-height: 560px) {
  .title-wrap { top: 3vh; gap: 4px; }
  .menu { gap: 8px; }
  .menu .big { min-height: 44px; padding: 8px 16px; font-size: 17px; }
  .tagline { margin-bottom: 2px; }
  .panel { padding: 14px 16px; }
  .panel-buttons { gap: 8px; margin-top: 10px; }
  .big { min-height: 46px; padding: 8px 16px; font-size: 16px; }
  .clear-stars i { font-size: 40px; }
}
@media (max-width: 420px) {
  .tab { min-width: 76px; }
  .stage-grid { gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {

__mods['src/save.js'] = (() => {
// セーブデータ — 進行・ベスト記録・設定を localStorage に保存する
// 壊れたデータ・保存できない環境(プライベートモード等)でも必ず起動できるようにする(品質基準 Q-09)。

const { CONFIG } = __req('src/config.js');

const VERSION = 1;
const STAGE_COUNT = 60;

const clampInt = (v, lo, hi, fallback) => {
  const n = Math.round(Number(v));
  return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : fallback;
};
const clamp01 = (v, fallback) => {
  const n = Number(v);
  return Number.isFinite(n) ? Math.min(1, Math.max(0, n)) : fallback;
};

function defaultSettings(reduceMotion = false) {
  return { ...CONFIG.DEFAULT_SETTINGS, reduceMotion };
}

function defaults(reduceMotion = false) {
  return {
    version: VERSION,
    cleared: {}, // ステージID → { moves, stars }(ベスト)
    lastStage: 1,
    endingSeen: false,
    settings: defaultSettings(reduceMotion),
  };
}

/** 読み込んだ値を検証し、不正な部分は捨てて安全な形にそろえる */
function sanitize(raw, reduceMotion) {
  const out = defaults(reduceMotion);
  if (!raw || typeof raw !== 'object') return out;

  if (raw.cleared && typeof raw.cleared === 'object') {
    for (const [k, v] of Object.entries(raw.cleared)) {
      const id = Number(k);
      if (!Number.isInteger(id) || id < 1 || id > STAGE_COUNT || !v || typeof v !== 'object') continue;
      // 範囲外・型違いの記録は、丸めずに捨てる(でたらめなベストを作らない)
      const { moves, stars } = v;
      if (Number.isInteger(moves) && moves >= 1 && moves <= 9999 && Number.isInteger(stars) && stars >= 1 && stars <= 3) {
        out.cleared[id] = { moves, stars };
      }
    }
  }
  out.lastStage = clampInt(raw.lastStage, 1, STAGE_COUNT, 1);
  out.endingSeen = raw.endingSeen === true;
  const s = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
  const d = out.settings;
  out.settings = {
    bgm: clamp01(s.bgm, d.bgm),
    sfx: clamp01(s.sfx, d.sfx),
    amb: clamp01(s.amb, d.amb),
    muted: typeof s.muted === 'boolean' ? s.muted : d.muted,
    reduceMotion: typeof s.reduceMotion === 'boolean' ? s.reduceMotion : d.reduceMotion,
    dpad: typeof s.dpad === 'boolean' ? s.dpad : d.dpad,
  };
  return out;
}

/** localStorage が使えなければ、メモリ上だけの代用品を返す */
function getStorage() {
  try {
    const s = window.localStorage;
    const k = '__hoshimeguri_test__';
    s.setItem(k, '1');
    s.removeItem(k);
    return s;
  } catch {
    const mem = new Map();
    return {
      getItem: (k) => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => { mem.set(k, String(v)); },
      removeItem: (k) => { mem.delete(k); },
    };
  }
}

class Save {
  /**
   * @param storage getItem/setItem/removeItem を持つもの
   * @param opts.reduceMotion OS設定で「動きを減らす」が有効か(初期設定に反映)
   * @param opts.unlockAll    全ステージ解放(テスト用)
   */
  constructor(storage, { reduceMotion = false, unlockAll = false } = {}) {
    this.storage = storage;
    this.reduceMotion = reduceMotion;
    this.unlockAll = unlockAll;
    this.data = defaults(reduceMotion);
    this.load();
  }

  load() {
    try {
      const text = this.storage.getItem(CONFIG.SAVE_KEY);
      this.data = text ? sanitize(JSON.parse(text), this.reduceMotion) : defaults(this.reduceMotion);
    } catch {
      this.data = defaults(this.reduceMotion); // 壊れていたら初期状態で起動
    }
  }

  persist() {
    try {
      this.storage.setItem(CONFIG.SAVE_KEY, JSON.stringify(this.data));
    } catch { /* 容量不足などは無視(遊べなくなるよりよい) */ }
  }

  get settings() { return this.data.settings; }

  setSettings(patch) {
    this.data.settings = sanitize({ settings: { ...this.data.settings, ...patch } }, this.reduceMotion).settings;
    this.persist();
  }

  isCleared(id) { return !!this.data.cleared[id]; }
  best(id) { return this.data.cleared[id] || null; }

  /** 直前のステージをクリアしていれば遊べる(最初のステージは常に遊べる) */
  isUnlocked(id) {
    if (this.unlockAll) return true;
    return id <= 1 || !!this.data.cleared[id - 1];
  }

  /** クリアを記録する。ベスト(手数・★)は良いほうを残す */
  record(id, moves, stars) {
    const prev = this.data.cleared[id] || null;
    const first = !prev;
    const newBest = !prev || moves < prev.moves;
    const bestStars = Math.max(stars, prev ? prev.stars : 0);
    this.data.cleared[id] = { moves: prev ? Math.min(prev.moves, moves) : moves, stars: bestStars };
    this.persist();
    return { first, newBest, prevMoves: prev ? prev.moves : null, bestMoves: this.data.cleared[id].moves, starsImproved: !prev || stars > prev.stars };
  }

  setLastStage(id) {
    this.data.lastStage = clampInt(id, 1, STAGE_COUNT, 1);
    this.persist();
  }

  markEndingSeen() {
    this.data.endingSeen = true;
    this.persist();
  }

  clearedCount() { return Object.keys(this.data.cleared).length; }
  totalStars() { return Object.values(this.data.cleared).reduce((a, v) => a + v.stars, 0); }
  totalMoves() { return Object.values(this.data.cleared).reduce((a, v) => a + v.moves, 0); }
  allCleared() { return this.clearedCount() >= STAGE_COUNT; }
  hasProgress() { return this.clearedCount() > 0; }

  /** 「つづきから」で開くステージ: 最後に遊んだ面が遊べるならそこ、なければ最初の未クリア面 */
  continueStage() {
    const last = this.data.lastStage;
    if (this.isUnlocked(last)) return last;
    for (let id = 1; id <= STAGE_COUNT; id++) if (!this.isCleared(id) && this.isUnlocked(id)) return id;
    return 1;
  }

  /** 進行を消す(設定は残す) */
  resetProgress() {
    const settings = this.data.settings;
    this.data = defaults(this.reduceMotion);
    this.data.settings = settings;
    this.persist();
  }
}
return { STAGE_COUNT, getStorage, Save };
})();

// 開発・自動確認用の道具(URL に ?debug が付いているときだけ app.js が読み込む)

    },

      app.play.update(0.05);
    },

     * 入力確認: スワイプ・タップ・2本指・置きっぱなしの指・取りこぼしなどを、擬似的なタッチ操作で再現し、

      const hy = hr.top + hr.height / 2;

      const cases = [];
      const add = (name, expected, actual) => cases.push({ name, expected, actual, ok: expected === actual });

      let m = fresh(); let p = pos();
      pe('pointerdown', cv, p.x, p.y, 7); pe('pointermove', cv, p.x + V[0] * 40, p.y + V[1] * 40, 7); pe('pointerup', cv, p.x + V[0] * 100, p.y + V[1] * 100, 7);

      add('離しの取りこぼしのあと、ボタンを押しても勝手に動かない', 0, gained(m));

      pe('pointerup', cv, p.x + V[0] * 100, p.y + V[1] * 100, 7); pe('pointerup', cv, p.x + 120 + V[0] * 100, p.y + V[1] * 100, 9);
      add('2本指のスワイプで2手進まない', 0, gained(m));

      pe('pointerdown', cv, p.x, p.y, 7); pe('pointerup', cv, p.x + V[0] * 100, p.y + V[1] * 100, 7);

     * クリア画面を経て、エンディングまで到達できるかを調べる。
     * @returns {Promise<{ok:boolean, mode:string, cleared:number, stars:number, moves:number, problems:string[]}>}
     */
    async playthrough() {
      const problems = [];
      const errors = [];
      const onError = (e) => errors.push(e.message);
      window.addEventListener('error', onError);

      app.save.resetProgress();
      app.enterTitle();
      document.getElementById('btn-start').click();
      await wait(50);

      for (let id = 1; id <= STAGES.length; id++) {
        if (app.mode !== 'play' || app.currentId !== id) {
          problems.push(`ステージ${id}に入れませんでした(mode=${app.mode}, 現在=${app.currentId})`);
          break;
        }
        const stage = app.play.stage;
        for (const c of stage.solution) app.dev.moveAndWait('URDL'.indexOf(c));
        for (let k = 0; k < 150 && !app.ui.isOverlayOpen('clear'); k++) app.play.update(1 / 60);
        if (!app.ui.isOverlayOpen('clear')) {
          problems.push(`${stage.name}: クリア画面が表示されませんでした`);
          break;
